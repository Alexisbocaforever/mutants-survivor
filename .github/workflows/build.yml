name: Build Windows and Web

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
         steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Ver que versiones de Qt Wasm existen
        run: |
          pip install aqtinstall
          python -m aqt list-qt linux wasm

      - name: Instalar Emscripten

      - name: Instalar Qt y su MinGW propio
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310'
          set-env: true

      - name: Usar el MinGW de Qt en vez del del sistema
        shell: pwsh
        run: |
          $mingwPath = "${{ github.workspace }}\..\Qt\Tools\mingw1310_64\bin"
          echo "$mingwPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compilar
        shell: pwsh
        run: |
          qmake MutantsSurvivor.pro
          mingw32-make release

      - name: Empaquetar dependencias de Qt
        shell: pwsh
        run: |
          windeployqt --release release\MutantsSurvivor.exe

      - name: Subir el ejecutable con sus DLLs
        uses: actions/upload-artifact@v4
        with:
          name: MutantsSurvivor-Windows
          path: release/

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.37'
          actions-cache-folder: 'emsdk-cache'

      - name: Instalar Qt para WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'wasm'
          arch: 'wasm_singlethread'

      - name: Compilar para WebAssembly
        shell: bash
        run: |
          qmake MutantsSurvivor.pro -spec wasm-emscripten CONFIG+=release
          make -j$(nproc)

      - name: Preparar carpeta para itch.io
        shell: bash
        run: |
          mkdir -p wasm-build
          cp MutantsSurvivor.html wasm-build/index.html
          cp MutantsSurvivor.js wasm-build/
          cp MutantsSurvivor.wasm wasm-build/
          cp MutantsSurvivor.data wasm-build/ 2>/dev/null || true
          cp qtloader.js wasm-build/ 2>/dev/null || true
          cp qtlogo.svg wasm-build/ 2>/dev/null || true

      - name: Empaquetar en zip
        shell: bash
        run: |
          cd wasm-build
          zip -r ../MutantsSurvivor-Web.zip .

      - name: Subir el paquete web
        uses: actions/upload-artifact@v4
        with:
          name: MutantsSurvivor-Web
          path: MutantsSurvivor-Web.zip