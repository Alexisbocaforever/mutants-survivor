build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      # 1. Instalar Qt WebAssembly primero
      - name: Instalar Qt para WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'all_os'
          target: 'wasm'
          arch: 'wasm_singlethread'

      # 2. Configurar la versión correcta de Emscripten (3.1.50) después de Qt
      - name: Instalar Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.50'
          actions-cache-folder: 'emsdk-cache-v2'

      # 3. Compilar usando un máximo de 2 hilos para no agotar la RAM
      - name: Compilar para WebAssembly
        shell: bash
        run: |
          qmake MutantsSurvivor.pro -spec wasm-emscripten CONFIG+=release
          make -j2

      - name: Preparar carpeta para itch.io
        shell: bash
        run: |
          mkdir -p wasm-build
          cp MutantsSurvivor.html wasm-build/index.html
          cp MutantsSurvivor.js wasm-build/
          cp MutantsSurvivor.wasm wasm-build/
          cp MutantsSurvivor.data wasm-build/ 2>/dev/null || true
          cp qtloader.js wasm-build/ 2>/dev/null || true
          cp qtlogo.svg wasm-build/ 2>/dev/null || true

      - name: Empaquetar en zip
        shell: bash
        run: |
          cd wasm-build
          zip -r ../MutantsSurvivor-Web.zip .

      - name: Subir el paquete web
        uses: actions/upload-artifact@v4
        with:
          name: MutantsSurvivor-Web
          path: MutantsSurvivor-Web.zip